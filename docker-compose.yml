services:
  creditdaddy:
    image: ghcr.io/lu8010252/checkin-hub:latest
    # build: .          # 想本地构建就取消注释，再 docker compose up -d --build
    container_name: creditdaddy
    restart: unless-stopped
    dns:                # 某些自定义网络里容器没有 DNS，加上更稳
      - 223.5.5.5
      - 119.29.29.29
    environment:
      - TZ=Asia/Shanghai
      - CREDITDADDY_HOME=/data
      - CREDITDADDY_PASSWORD=改成你的面板密码
      # - CREDITDADDY_NTFY_URL=https://ntfy.sh/your-topic   # 签到结果推到这里
      # - CREDITDADDY_NTFY_TOKEN=tk_xxx                     # 自建 ntfy 需要鉴权时填
    ports:
      - "47861:47860"   # 面板：http://服务器IP:47861
    volumes:
      - ./data:/data    # 账号、令牌、日志都在这里，别删
