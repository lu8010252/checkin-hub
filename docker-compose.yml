services:
  checkin:
    image: ghcr.io/lu8010252/checkin-hub:latest   # amd64 / arm64 / armv7 通用
    # build: .                                    # 想本地构建就取消注释，再 docker compose up -d --build
    container_name: checkin-hub
    restart: unless-stopped
    environment:
      - WEB_PASSWORD=改成你自己的登录密码
      # - TRUST_PROXY=1        # 前面有反向代理(HTTPS)时打开
    ports:
      - "8090:8080"            # 网页后台：http://服务器IP:8090
    volumes:
      - ./data:/data           # 令牌、设置、记录都在这里，别删
